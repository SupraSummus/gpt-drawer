[tool.poetry]
name = "gpt-drawer"
version = "0.1.0"
description = ""
authors = ["Jan Rydzewski <flegmer@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "==3.14.*"
django = "==5.2.*"
django-environ = "*"
psycopg = "*"
djangorestframework = "*"
markdown = "*"
django-filter = "*"
drf-nested-routers = "*"
openai = "*"
pgvector = "*"
django-q2 = "*"
django-htmx = "*"
django-rest-knox = "*"

[tool.poetry.group.dev.dependencies]
flake8 = "*"
flake8-isort = "*"
pytest = "*"
pytest-django = "*"
pytest-cov = "*"
factory-boy = "*"
django-debug-toolbar = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
skip_gitignore = true
line_length = 119
lines_after_imports = 2
# 5 = Hanging Grid Grouped
multi_line_output = 5
include_trailing_comma = true

[tool.black]
line-length = 119
skip-string-normalization = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gpt_drawer.settings"
python_files = ["*_test.py"]
FAIL_INVALID_TEMPLATE_VARS = true
addopts = "--reuse-db"
